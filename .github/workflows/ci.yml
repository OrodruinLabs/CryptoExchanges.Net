name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CryptoExchanges.Net.slnx

      - name: Build
        run: dotnet build CryptoExchanges.Net.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CryptoExchanges.Net.slnx --no-build --configuration Release --verbosity normal --filter 'Category!=Integration'
